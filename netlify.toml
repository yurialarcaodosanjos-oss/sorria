# Netlify config for the #Smile site

[build]
  publish = "."

# /admin → /admin.html (must come BEFORE the shirt-code rewrite)
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Pretty URL: /SMILE1 → /scan.html?code=SMILE1
# Netlify skips this when the path matches an existing file,
# so /index.html, /scan.html, /admin.html, /styles.css, /vendor/*, etc.
# still serve normally.
[[redirects]]
  from = "/:code"
  to = "/scan.html?code=:code"
  status = 200

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Prevent admin page from being indexed by search engines
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
