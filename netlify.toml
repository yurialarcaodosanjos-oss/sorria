# Netlify config for the #Smile site
# No build step needed — this is a static site.

[build]
  publish = "."

# Pretty URL: /SMILE1 → /scan.html?code=SMILE1
# Lets shirt QR codes use clean short URLs.
[[redirects]]
  from = "/:code"
  to = "/scan.html?code=:code"
  status = 200
  conditions = {Path = ["/^[A-Z0-9]{3,12}$/"]}

# Don't redirect actual HTML pages
[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200
  force = false

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
